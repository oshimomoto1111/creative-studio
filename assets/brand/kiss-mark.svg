<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" fill="none">
  <defs>
    <linearGradient id="kissGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4081"/>
      <stop offset="50%" stop-color="#d81e34"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="kissFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" result="rough"/>
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g filter="url(#kissFilter)" fill="url(#kissGrad)" opacity="0.9">
    <!-- Upper Lip: Left & Right M-Curves with Center Indentation -->
    <path d="M 15,55 C 30,35 60,30 80,42 C 100,30 130,35 145,55 C 132,60 115,52 80,56 C 45,52 28,60 15,55 Z"/>
    
    <!-- Vertical Upper Lip Creases -->
    <g fill="#991b1b" opacity="0.7">
      <rect x="45" y="40" width="2" height="14" rx="1" transform="rotate(-6 45 40)"/>
      <rect x="60" y="38" width="2" height="16" rx="1" transform="rotate(-3 60 38)"/>
      <rect x="75" y="42" width="2" height="14" rx="1"/>
      <rect x="85" y="42" width="2" height="14" rx="1"/>
      <rect x="100" y="38" width="2" height="16" rx="1" transform="rotate(3 100 38)"/>
      <rect x="115" y="40" width="2" height="14" rx="1" transform="rotate(6 115 40)"/>
    </g>

    <!-- Lower Lip: Full Plump Crescent with Center Indent -->
    <path d="M 22,62 C 40,58 70,64 80,64 C 90,64 120,58 138,62 C 130,85 105,98 80,98 C 55,98 30,85 22,62 Z"/>

    <!-- Vertical Lower Lip Creases -->
    <g fill="#991b1b" opacity="0.7">
      <rect x="42" y="65" width="2" height="18" rx="1" transform="rotate(4 42 65)"/>
      <rect x="58" y="66" width="2.2" height="22" rx="1" transform="rotate(2 58 66)"/>
      <rect x="74" y="67" width="2.5" height="25" rx="1"/>
      <rect x="86" y="67" width="2.5" height="25" rx="1"/>
      <rect x="102" y="66" width="2.2" height="22" rx="1" transform="rotate(-2 102 66)"/>
      <rect x="118" y="65" width="2" height="18" rx="1" transform="rotate(-4 118 65)"/>
    </g>
  </g>
</svg>
