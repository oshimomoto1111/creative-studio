<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" fill="none">
  <defs>
    <filter id="inkShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Sailor Swallow in Flight -->
  <g filter="url(#inkShadow)">
    <!-- Back Wing (Dark Burgundy & Hot Pink Highlights) -->
    <path d="M120 90 C130 50 160 20 195 10 C180 35 170 65 145 92 Z" fill="#4A0E17" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M150 45 C165 30 180 22 195 10 C185 30 178 50 162 70 Z" fill="#D81E34" stroke="#000000" stroke-width="2"/>
    <path d="M165 35 C175 25 185 18 195 10 C188 25 182 40 172 55 Z" fill="#FF4081"/>

    <!-- Forked Swallow Tail -->
    <path d="M70 145 C45 165 15 185 5 210 C30 185 50 175 75 162 Z" fill="#4A0E17" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M60 160 C35 180 15 195 18 202 C35 185 55 175 68 168 Z" fill="#D81E34"/>
    <path d="M85 152 C75 180 65 205 60 215 C75 190 85 175 92 155 Z" fill="#4A0E17" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Bird Body -->
    <path d="M140 100 C155 100 170 105 180 115 C175 130 150 150 110 150 C85 150 75 140 70 135 C80 120 110 100 140 100 Z" fill="#D81E34" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

    <!-- Bird Belly / Breast in Warm Cream (Classic Sailor Tattoo) -->
    <path d="M140 115 C150 120 155 130 145 142 C130 148 115 145 105 138 C115 125 128 116 140 115 Z" fill="#F8F2E2" stroke="#000000" stroke-width="2.5"/>
    <path d="M135 125 C142 128 145 135 140 140 C132 142 122 138 118 132 C124 128 130 126 135 125 Z" fill="#F4B942"/>

    <!-- Fore Wing (Spanning Upward with Vinyl Highlights) -->
    <path d="M110 120 C95 80 85 45 100 15 C120 40 135 75 130 115 Z" fill="#D81E34" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
    <!-- Wing Feathers -->
    <path d="M98 35 C108 55 118 85 118 110" stroke="#000000" stroke-width="2.5"/>
    <path d="M92 50 C100 70 108 95 108 112" stroke="#000000" stroke-width="2"/>
    <path d="M102 22 C95 45 92 70 98 90 Z" fill="#FF4081" stroke="#000000" stroke-width="2"/>
    <path d="M100 15 C104 28 108 42 108 55 Z" fill="#FFFFFF" opacity="0.8"/>

    <!-- Bird Head & Eye -->
    <path d="M165 108 C175 108 185 115 182 125 C178 128 172 128 165 125 Z" fill="#D81E34" stroke="#000000" stroke-width="3"/>
    <circle cx="174" cy="116" r="3.5" fill="#F4B942" stroke="#000000" stroke-width="1.8"/>
    <circle cx="174.5" cy="115.5" r="1.5" fill="#000000"/>
    <circle cx="173.8" cy="114.8" r="0.6" fill="#FFFFFF"/>

    <!-- Bird Beak -->
    <path d="M182 118 L195 122 L182 126 Z" fill="#F4B942" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Love Letter in Beak -->
    <g transform="translate(185, 120) rotate(15)">
      <rect x="0" y="0" width="34" height="24" rx="2" fill="#F8F2E2" stroke="#000000" stroke-width="3"/>
      <!-- Air Mail Red/Blue Edge Chevrons -->
      <path d="M2 2 L8 2 L5 6 Z" fill="#D81E34"/>
      <path d="M10 2 L16 2 L13 6 Z" fill="#1E88E5"/>
      <path d="M18 2 L24 2 L21 6 Z" fill="#D81E34"/>
      <path d="M26 2 L32 2 L29 6 Z" fill="#1E88E5"/>
      <!-- Envelope Flap Lines -->
      <path d="M0 0 L17 14 L34 0" stroke="#000000" stroke-width="2"/>
      <path d="M0 24 L13 11" stroke="#000000" stroke-width="1.5"/>
      <path d="M34 24 L21 11" stroke="#000000" stroke-width="1.5"/>
      <!-- Little Red Wax Heart Seal -->
      <circle cx="17" cy="14" r="4.5" fill="#D81E34" stroke="#000000" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Neo-traditional Ribbon Banner below Swallow -->
  <g filter="url(#inkShadow)" transform="translate(15, 160)">
    <!-- Banner Ribbons Tails -->
    <path d="M5 25 L-5 40 L25 35 L20 18 Z" fill="#4A0E17" stroke="#000000" stroke-width="3"/>
    <path d="M185 25 L195 40 L165 35 L170 18 Z" fill="#4A0E17" stroke="#000000" stroke-width="3"/>

    <!-- Main Curved Banner Body -->
    <path d="M15 15 C60 0 130 0 175 15 L170 42 C125 28 65 28 20 42 Z" fill="#F8F2E2" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Banner Text: LOVERBOY ABQ -->
    <text x="95" y="32" font-family="'Shrikhand', 'Space Mono', cursive" font-weight="bold" font-size="14" fill="#D81E34" text-anchor="middle" stroke="#000000" stroke-width="0.8" letter-spacing="1.5">
      ★ LOVERBOY ABQ ★
    </text>
  </g>
</svg>
