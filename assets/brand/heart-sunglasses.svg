<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 120" width="220" height="120" fill="none">
  <defs>
    <radialGradient id="lensTint" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff4081" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#991b1b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2a060a" stop-opacity="1"/>
    </radialGradient>
    <filter id="glassGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff4081" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#glassGlow)">
    <!-- Bridge connecting the two heart frames -->
    <path d="M 96,44 Q 110,38 124,44" stroke="#d81e34" stroke-width="7" stroke-linecap="round"/>
    <path d="M 98,44 Q 110,40 122,44" stroke="#ff8595" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Heart Frame & Lens -->
    <g transform="translate(10, 8)">
      <!-- Outer Thick Acetate Frame -->
      <path d="M 45,18 C 30,0 2,12 2,42 C 2,68 45,96 45,96 C 45,96 88,68 88,42 C 88,12 60,0 45,18 Z" fill="#d81e34" stroke="#4a0e17" stroke-width="4"/>
      <!-- Inner Dark Tinted Lens -->
      <path d="M 45,26 C 33,12 12,22 12,44 C 12,65 45,86 45,86 C 45,86 78,65 78,44 C 78,22 57,12 45,26 Z" fill="url(#lensTint)"/>
      <!-- Lens Star Glare Highlight -->
      <polygon points="30,32 32,36 36,38 32,40 30,44 28,40 24,38 28,36" fill="#ffffff" opacity="0.9"/>
      <circle cx="30" cy="38" r="1.5" fill="#ffffff"/>
      <!-- Diagonal White Glare Stripe -->
      <path d="M 22,48 Q 38,62 50,75" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    </g>

    <!-- Right Heart Frame & Lens -->
    <g transform="translate(120, 8)">
      <!-- Outer Thick Acetate Frame -->
      <path d="M 45,18 C 30,0 2,12 2,42 C 2,68 45,96 45,96 C 45,96 88,68 88,42 C 88,12 60,0 45,18 Z" fill="#d81e34" stroke="#4a0e17" stroke-width="4"/>
      <!-- Inner Dark Tinted Lens -->
      <path d="M 45,26 C 33,12 12,22 12,44 C 12,65 45,86 45,86 C 45,86 78,65 78,44 C 78,22 57,12 45,26 Z" fill="url(#lensTint)"/>
      <!-- Lens Star Glare Highlight -->
      <polygon points="30,32 32,36 36,38 32,40 30,44 28,40 24,38 28,36" fill="#ffffff" opacity="0.9"/>
      <circle cx="30" cy="38" r="1.5" fill="#ffffff"/>
      <!-- Diagonal White Glare Stripe -->
      <path d="M 22,48 Q 38,62 50,75" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    </g>

    <!-- Retro Eyewear Temples (Tips on sides) -->
    <path d="M 12,40 Q 2,36 0,32" stroke="#d81e34" stroke-width="5" stroke-linecap="round"/>
    <path d="M 208,40 Q 218,36 220,32" stroke="#d81e34" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
