<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140" fill="none">
  <defs>
    <filter id="envelopeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Envelope Body (Vintage Cream) -->
  <rect x="10" y="10" width="180" height="120" rx="6" fill="#f8f2e2" stroke="#d81e34" stroke-width="2" filter="url(#envelopeShadow)"/>

  <!-- Airmail Red & Hot Pink Striped Border -->
  <g opacity="0.85">
    <polygon points="10,10 22,10 10,22" fill="#d81e34"/>
    <polygon points="26,10 38,10 20,28 10,28 10,26" fill="#ff4081"/>
    <polygon points="42,10 54,10 36,28 24,28" fill="#d81e34"/>
    <polygon points="58,10 70,10 52,28 40,28" fill="#ff4081"/>
    
    <polygon points="190,130 178,130 190,118" fill="#d81e34"/>
    <polygon points="174,130 162,130 180,112 190,112 190,114" fill="#ff4081"/>
    <polygon points="158,130 146,130 164,112 176,112" fill="#d81e34"/>
  </g>

  <!-- Fold Lines -->
  <path d="M 10,10 L 100,75 L 190,10" stroke="#d81e34" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <path d="M 10,130 L 75,65" stroke="#d81e34" stroke-width="1.2" opacity="0.3"/>
  <path d="M 190,130 L 125,65" stroke="#d81e34" stroke-width="1.2" opacity="0.3"/>

  <!-- Postage Stamp in Top Right (Loverboy Cup) -->
  <g transform="translate(142, 18)">
    <rect x="0" y="0" width="38" height="46" rx="2" fill="#4a0e17" stroke="#ff4081" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="19" y="14" font-family="'Space Mono', monospace" font-size="7" fill="#f8f2e2" text-anchor="middle" font-weight="bold">USA 66¢</text>
    <!-- Little Cup -->
    <polygon points="12,20 26,20 24,36 14,36" fill="#d81e34"/>
    <rect x="10" y="18" width="18" height="3" rx="1" fill="#f8f2e2"/>
    <!-- Postmark Wavy Lines (Postal Cancellation) -->
    <path d="M -20,20 Q -10,15 0,20 Q 10,25 20,20 Q 30,15 40,20" stroke="#d81e34" stroke-width="1.5" fill="none" opacity="0.8"/>
    <path d="M -20,26 Q -10,21 0,26 Q 10,31 20,26 Q 30,21 40,26" stroke="#d81e34" stroke-width="1.5" fill="none" opacity="0.8"/>
  </g>

  <!-- Recipient Address Block (Vintage Typewriter Style) -->
  <g font-family="'Space Mono', monospace" fill="#140c0d">
    <text x="35" y="65" font-size="9" font-weight="bold" letter-spacing="1">TO: MY FAVORITE LOVERBOY</text>
    <text x="35" y="80" font-size="8" fill="#4a0e17">WALK-UP WINDOW • NOB HILL</text>
    <text x="35" y="93" font-size="8" fill="#4a0e17">CENTRAL AVE &amp; RICHMOND DR SE</text>
    <text x="35" y="106" font-size="8" fill="#d81e34" font-weight="bold">ALBUQUERQUE, NM 87106</text>
  </g>

  <!-- Red Wax Seal in Center Bottom -->
  <g transform="translate(100, 75) scale(0.35)">
    <circle cx="0" cy="0" r="32" fill="#d81e34" stroke="#ff8595" stroke-width="2"/>
    <text x="0" y="7" font-family="'Shrikhand', cursive" font-size="22" fill="#f8f2e2" text-anchor="middle">♥</text>
  </g>
</svg>
