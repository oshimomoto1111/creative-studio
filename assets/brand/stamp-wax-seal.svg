<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <radialGradient id="waxGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ff3355"/>
      <stop offset="35%" stop-color="#d81e34"/>
      <stop offset="70%" stop-color="#8a0c1b"/>
      <stop offset="100%" stop-color="#4a0e17"/>
    </radialGradient>
    <filter id="waxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Irregular Melted Wax Edge Silhouette -->
  <path d="M 80,12 C 102,10 118,18 132,32 C 146,46 152,64 150,84 C 148,104 140,122 126,134 C 112,146 92,150 74,148 C 54,146 36,138 24,124 C 12,110 8,92 10,72 C 12,52 22,34 36,22 C 50,12 65,14 80,12 Z" fill="url(#waxGrad)" filter="url(#waxShadow)"/>

  <!-- Inner Pressed Intaglio Ring -->
  <circle cx="80" cy="80" r="54" stroke="#ff8595" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="80" cy="80" r="50" stroke="#3d050c" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- Embossed Outer Lettering -->
  <path id="waxTextTop" d="M 40,80 A 40,40 0 1,1 120,80" fill="none"/>
  <path id="waxTextBottom" d="M 120,80 A 40,40 0 0,1 40,80" fill="none"/>
  
  <text font-family="'Shrikhand', cursive" font-size="9.5" fill="#f8f2e2" letter-spacing="1.5" opacity="0.95">
    <textPath href="#waxTextTop" startOffset="50%" text-anchor="middle">★ LOVERBOY ★</textPath>
  </text>
  <text font-family="'Space Mono', monospace" font-size="7.5" fill="#f8f2e2" letter-spacing="2" font-weight="bold" opacity="0.85">
    <textPath href="#waxTextBottom" startOffset="50%" text-anchor="middle">NOB HILL ABQ</textPath>
  </text>

  <!-- Centerpiece: Coffee Bean Pierced by Cupid's Arrow -->
  <g transform="translate(80, 80)">
    <!-- Coffee Bean Silhouette -->
    <ellipse cx="0" cy="0" rx="16" ry="21" fill="#4a0e17" stroke="#ff8595" stroke-width="1.8"/>
    <!-- Coffee Bean Curved Creep S-Line -->
    <path d="M 0,-18 C -5,-8 5,0 0,8 C -4,14 -1,18 0,18" stroke="#f8f2e2" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    
    <!-- Piercing Cupid Arrow -->
    <line x1="-28" y1="18" x2="28" y2="-18" stroke="#ff4081" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Arrowhead Heart -->
    <path d="M 28,-18 L 34,-14 L 30,-22 Z" fill="#ff4081"/>
    <!-- Arrow Fletching -->
    <line x1="-24" y1="21" x2="-28" y2="15" stroke="#ff4081" stroke-width="2"/>
    <line x1="-20" y1="24" x2="-24" y2="18" stroke="#ff4081" stroke-width="2"/>
  </g>
</svg>
