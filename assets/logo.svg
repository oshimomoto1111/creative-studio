<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Radiant Singularity Glow -->
    <radialGradient id="voidCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#e5a93c"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#e5a93c"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Outer Celestial Alignment Ring -->
  <circle cx="50" cy="50" r="45" stroke="#e5a93c" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.45"/>
  <circle cx="50" cy="50" r="40" stroke="#f4f4f6" stroke-width="2.5" opacity="0.9"/>

  <!-- The "V" (Void): Bold Descending Chevron -->
  <path d="M 27 28 L 50 78 L 73 28" stroke="url(#amberGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The "A" (Atelier): Bold Ascending Chevron -->
  <path d="M 27 72 L 50 22 L 73 72" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Horizontal Horizon Crossbar for "A" -->
  <line x1="37" y1="53" x2="63" y2="53" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>

  <!-- Central Singularity Lens: The Convergence Point -->
  <circle cx="50" cy="50" r="9" fill="url(#voidCoreGlow)" opacity="0.75"/>
  <circle cx="50" cy="50" r="4" fill="#ffffff"/>
  <circle cx="50" cy="50" r="2" fill="#e5a93c"/>
</svg>
